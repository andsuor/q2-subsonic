name: Release
# A tag q2-vX.Y (made by contrib/release.sh) must match cmd/q2-subsonic/main.go's version and have a
# CHANGELOG.md section. It builds the card files and publishes them as the release's only ZIP, which
# Q2 Pod's System settings -> App Store installs, with that section as the release notes.
on:
  push:
    tags: ['q2-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and changelog
        run: |
          v=${GITHUB_REF_NAME#q2-v}
          want=$(sed -n 's/^const version = "\(q2-v[0-9.]*\)"$/\1/p' cmd/q2-subsonic/main.go)
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but main.go's version is $want"; exit 1; }
          contrib/changelog-section.sh "$v" >notes.md || { echo "::error::CHANGELOG.md has no entries under ## [$v]"; exit 1; }
          compare=$(sed -n "s|^\[$v\]: \(.*/compare/.*\)|\1|p" CHANGELOG.md) # none for the first release
          { echo; echo '---'; [ -z "$compare" ] || printf '**Full changes:** %s\n\n' "$compare"
            echo 'Install or update from Q2 Pod: System settings → App Store (or unzip to the card root).'; } >>notes.md
          cat notes.md
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27' # current, with its security fixes; go.mod's go line is only the minimum (M44)
          check-latest: true
      - name: Test
        run: |
          go vet ./...
          go test ./...
          python3 contrib/shanlingq2/test_launcher.py
      - name: Build
        run: contrib/shanlingq2/build.sh target/shanlingq2
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" target/shanlingq2/q2-subsonic-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" target/shanlingq2/q2-subsonic-*.zip \
              --title "q2-subsonic ${GITHUB_REF_NAME#q2-}" --notes-file notes.md
          fi
